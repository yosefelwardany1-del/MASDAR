user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 25M;

    # nginx workers run as www-data (see `user` above), but the stock alpine temp dirs
    # under /var/lib/nginx are owned by the `nginx` user. When a request body (file upload)
    # exceeds client_body_buffer_size, nginx buffers it to client_body_temp_path — if that
    # dir isn't writable the upload fails with nginx's own 500. Point all temp paths at a
    # www-data-owned dir (created + chowned in entrypoint.sh) so uploads work.
    client_body_temp_path /tmp/nginx/client_body;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    proxy_temp_path       /tmp/nginx/proxy;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    server {
        listen 8080;
        server_name _;
        root /var/www/html/public;
        index index.php;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_read_timeout 300;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location ~ /\.(?!well-known) {
            deny all;
        }
    }

    # PHP-FPM's own pool counters (active/idle workers, the listen queue, how often the pool
    # hit pm.max_children). Bound to loopback on a port Render does not expose, so only the
    # Render shell can read it: wget -qO- http://127.0.0.1:9001/fpm-status
    server {
        listen 127.0.0.1:9001;
        access_log off;

        location = /fpm-status {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;
            fastcgi_pass 127.0.0.1:9000;
        }
    }
}
