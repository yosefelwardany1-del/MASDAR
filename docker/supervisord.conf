[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
autostart=true
autorestart=true
# FPM's master logs "server reached pm.max_children setting" HERE. In a file nobody reads,
# a full worker pool (requests queueing before PHP starts) looked like "the ERP is slow" with
# nothing in the logs; on stderr it shows up in Render's log stream.
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/var/log/supervisor/php-fpm.out.log

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/nginx.err.log
stdout_logfile=/var/log/supervisor/nginx.out.log

[program:queue]
command=php /var/www/html/artisan queue:work --queue=default --sleep=3 --tries=3 --max-time=3600
user=www-data
environment=HOME="/var/www/html"
autostart=true
autorestart=true
# Single worker on the 512 MB instance — each queue:work is a full ~60-100 MB PHP
# process; two of them plus the scheduler crowded out the web workers and caused OOM.
numprocs=1
process_name=%(program_name)s_%(process_num)02d
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:scheduler]
command=/bin/sh -c "while true; do php /var/www/html/artisan schedule:run --no-interaction; sleep 60; done"
user=www-data
environment=HOME="/var/www/html"
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/scheduler.err.log
stdout_logfile=/var/log/supervisor/scheduler.out.log
