[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

; Sized for the STANDARD instance (2 GB RAM, 1 CPU; Render metrics, Oct 2026: the whole
; container sits near 200 MB and 7-15% of the CPU). The pool used to be 6 children, chosen for
; a 512 MB box. Almost every request is spent WAITING on the database (Neon is a network hop away),
; not computing. With 6 children a burst of slow requests fills the pool, and the rest wait
; in FPM's backlog BEFORE PHP starts — invisible to ProfileRequest, which only times the
; request once it has a worker (two /profile loads took 21 s and 26 s with no "Slow request"
; line logged). More children cost memory, not CPU: a child is ~60-100 MB at most, so 14 is
; ~1.1 GB worst case beside the queue worker, scheduler, nginx and opcache — inside 2 GB.
; 'dynamic' keeps a few warm and grows under load. (NOTE: php-fpm pool files use ';' for
; comments, NOT '#'. A '#' line makes php-fpm fail to start -> nginx 502 on every request.)
pm = dynamic
pm.max_children = 14
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 300
; Read from the Render shell with `wget -qO- http://127.0.0.1:9001/fpm-status` (see nginx.conf): 'max children
; reached' above 0 means requests really did queue for a worker; 'listen queue' is who is waiting now.
pm.status_path = /fpm-status
clear_env = no
