; Sized for a 512 MB instance. opcache memory is SHARED (reserved once at startup), so
; keep it modest — 256 MB consumption + 128 MB JIT previously reserved 384 MB up front and
; left almost nothing for the workers/queue/nginx, causing OOM under any real request.
; (NOTE: PHP ini files use ';' for comments, NOT '#'.)
opcache.enable=1
opcache.memory_consumption=96
opcache.max_accelerated_files=12000
opcache.validate_timestamps=0
opcache.jit=1255
opcache.jit_buffer_size=64M

upload_max_filesize=20M
post_max_size=25M
max_execution_time=120
; Per-request ceiling. Kept well below total RAM so a single request can never claim the
; whole instance (was 512 MB == the entire box).
memory_limit=256M

expose_php=Off
; Never include credentials or customer data passed as function arguments in traces.
zend.exception_ignore_args=On
