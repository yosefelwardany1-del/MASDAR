# MASDAR on Render, everything in one Blueprint: New → Blueprint → this repository → Apply.
# Render creates the web service (nginx + php-fpm + queue worker + scheduler, from the
# Dockerfile), its PostgreSQL database and a persistent disk for uploaded files (logos, product
# photos, contracts, payment slips), and wires them together. Every deploy runs the migrations
# and the role and reference seeders (docker/entrypoint.sh).
#
# Singapore is Render's region nearest to the Yiwu office. A service's region can't change later.

databases:
  - name: masdar-db
    databaseName: masdar
    user: masdar
    plan: 0.1c-256mb
    # Pinned: the image's pg_dump (nightly backup) must be at least the server's version.
    postgresMajorVersion: "16"
    region: singapore
    diskSizeGB: 5
    ipAllowList: []          # no connections from outside Render

services:
  - type: web
    name: masdar
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    region: singapore
    branch: main
    autoDeployTrigger: checksPass   # deploy a push to main only after CI passes
    healthCheckPath: /up
    # Uploaded files live here and survive deploys (PRIVATE_DISK=local). A service with a disk
    # runs as one instance; that is plenty for MASDAR's team.
    disk:
      name: masdar-files
      mountPath: /var/www/html/storage/app
      sizeGB: 10
    envVars:
      - key: APP_NAME
        value: MASDAR
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      # APP_URL is optional: without it the app uses the address Render gives the service
      # (RENDER_EXTERNAL_URL). Set it once MASDAR has its own domain.
      - key: APP_TIMEZONE
        value: Asia/Shanghai
      - key: APP_LOCALE
        value: ar

      # PostgreSQL (the masdar-db above). The invariants live in the database: triggers and CHECKs.
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: masdar-db
          property: connectionString
      - key: DB_SSLMODE
        value: prefer

      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "10080"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: PRIVATE_DISK
        value: local

      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning

      - key: MAIL_MAILER
        value: log
      - key: MAIL_FROM_NAME
        value: MASDAR

      # Nightly backup (backup:run, 02:15 China time). Production refuses a local destination,
      # so until Google Drive or an S3-compatible bucket is set (README § Backups) the nightly
      # run fails and logs a warning; Render's own daily database backups still apply.
      - key: BACKUP_RETENTION_DAYS
        value: "30"
      - key: BACKUP_GOOGLE_DRIVE
        value: "false"

      # Optional, added later in the service's Environment tab when wanted (no value here so
      # the Blueprint asks for nothing): APP_URL, MAIL_* (a real mailer), BACKUP_DISK and the
      # AWS_* bucket values, GOOGLE_DRIVE_*, ANTHROPIC_API_KEY or OPENROUTER_API_KEY,
      # WHATSAPP_ACCESS_TOKEN and WHATSAPP_PHONE_NUMBER_ID, SSO_GOOGLE_*.
